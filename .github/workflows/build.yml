name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build with Maven
        run: mvn -B -DskipTests package -Dstyle.color=always -DtrimStackTrace=false
      - name: Show Java/Maven
        run: |
          java -version
          mvn -v
